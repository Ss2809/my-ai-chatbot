
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>✦ My AI</h2>

            <button class="new-chat" id="newChatBtn">
                + New Chat
            </button>

            <div class="sidebar-footer">
                <p>Powered by OpenRouter</p>
                <span>AI Assistant</span>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="main">

            <header class="header">
                <h3>AI Assistant</h3>
                <span class="status">● Online</span>
            </header>

            <section class="chat-container" id="chatContainer">

                <div class="welcome" id="welcome">
                    <h1>How can I help you today?</h1>
                    <p>Ask anything. Let's explore together.</p>
                </div>

            </section>

            <!-- Input Area -->
            <div class="input-area">

                <div class="input-box">
                    <textarea
                        id="messageInput"
                        placeholder="Message AI Assistant..."
                        rows="1"
                    ></textarea>

                  <button id="sendBtn" type="button">↑</button>
                </div>

                <p class="disclaimer">
                    AI can make mistakes. Verify important information.
                </p>

            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
